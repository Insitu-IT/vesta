# Plain-Secret shape only. DO NOT APPLY this file as-is.
# Both CHANGE_* namespaces are intentionally invalid Kubernetes names.
# Replace every example value from the customer's secret manager or private
# mode-0600 files. Never commit a filled copy or log `oc get secret -o yaml`.
# Fresh resource names use vesta. Existing installations keep accepted Secret
# names and credentials; this file is not an upgrade/reset procedure.
# Keep names synchronized with the private site.json used by render.py.
# Dedicated PostgreSQL profile additionally uses postgres.json for its two
# Secret names. Passwords must match the separately provisioned application URLs.
apiVersion: v1
kind: Secret
metadata:
  name: vesta-postgres-bootstrap
  namespace: CHANGE_APP_NAMESPACE
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_PRIVATE_BOOTSTRAP_PASSWORD
  OWNER_PASSWORD: REPLACE_WITH_PRIVATE_OWNER_PASSWORD
  RUNTIME_PASSWORD: REPLACE_WITH_PRIVATE_RUNTIME_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-postgres-tls
  namespace: CHANGE_APP_NAMESPACE
type: kubernetes.io/tls
stringData:
  tls.crt: REPLACE_WITH_DATABASE_SERVICE_CERTIFICATE_PEM
  tls.key: REPLACE_WITH_DATABASE_SERVICE_PRIVATE_KEY_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-db-owner
  namespace: CHANGE_APP_NAMESPACE
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_VERIFIED_TLS_OWNER_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-db-runtime
  namespace: CHANGE_APP_NAMESPACE
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_VERIFIED_TLS_RESTRICTED_RUNTIME_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-application
  namespace: CHANGE_APP_NAMESPACE
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_RANDOM_SECRET
  VESTA_ENCRYPTION_KEY: REPLACE_WITH_CUSTODIED_FERNET_KEY
  ORCHESTRATOR_TO_AGENT_KEY: REPLACE_WITH_SHARED_SCOPED_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-initial-admin
  namespace: CHANGE_APP_NAMESPACE
type: Opaque
stringData:
  password: REPLACE_WITH_PRIVATE_INITIAL_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-backend-tls
  namespace: CHANGE_APP_NAMESPACE
type: kubernetes.io/tls
stringData:
  tls.crt: REPLACE_WITH_API_HOST_CERTIFICATE_PEM
  tls.key: REPLACE_WITH_API_HOST_PRIVATE_KEY_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-agent-tls
  namespace: CHANGE_AGENT_NAMESPACE
type: kubernetes.io/tls
stringData:
  tls.crt: REPLACE_WITH_AGENT_SERVICE_CERTIFICATE_PEM
  tls.key: REPLACE_WITH_AGENT_SERVICE_PRIVATE_KEY_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-agent-registration
  namespace: CHANGE_AGENT_NAMESPACE
type: Opaque
stringData:
  REGISTRATION_KEY: REPLACE_WITH_API_ISSUED_REGISTRATION_KEY
  KEYSTORE_IDENTITY: REPLACE_WITH_STABLE_CUSTODIED_IDENTITY
  ORCHESTRATOR_API_KEY: REPLACE_WITH_SHARED_SCOPED_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-trust
  namespace: CHANGE_APP_NAMESPACE
type: Opaque
stringData:
  ca.crt: REPLACE_WITH_TRUST_BUNDLE_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: vesta-trust
  namespace: CHANGE_AGENT_NAMESPACE
type: Opaque
stringData:
  ca.crt: REPLACE_WITH_TRUST_BUNDLE_PEM
