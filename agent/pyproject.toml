[tool.poetry]
name = "vesta-agent"
version = "5.0.0"
description = "Vesta Backup agent for KVM hosts"
authors = ["Vesta Backup maintainers"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
httpx = "^0.25.2"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
libvirt-python = {version = "^9.10.0", optional = true}
psutil = "^5.9.6"
aiofiles = "^23.2.1"
python-json-logger = "^2.0.7"
cryptography = "^41.0.7"
prometheus-client = "^0.19.0"
certifi = "^2024.0.0"
# v3.0: S3 storage support (optional)
boto3 = {version = "^1.34.0", optional = true}

[tool.poetry.extras]
libvirt = ["libvirt-python"]
s3 = ["boto3"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
ruff = "^0.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
