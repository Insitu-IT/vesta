pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Telemetry is backend-Service-only; never serve the SPA or proxy here.
        # OPS restricts backend ingress to 10.0.0.0/8, without trusting XFF.
        location = /metrics { return 404; }
        location ^~ /metrics/ { return 404; }

        # Optional read-only runtime appearance mount. Missing config is a real 404.
        location ^~ /appearance/ {
            root /etc;
            # Accept appearance files on the inherited Docker mount.
            try_files /vesta$uri /vnbui$uri =404;
            autoindex off;
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'none'; sandbox" always;
        }

        location ^~ /assets/ {
            if ($uri ~* \.map$) { return 404; }
            try_files $uri =404;
        }
        location ^~ /locales/ {
            if ($uri ~* \.map$) { return 404; }
            try_files $uri =404;
        }
        location = /api { return 404; }

        # SPA routing
        # Source maps are never a customer asset, even if a stale file is copied.
        location ~* \.map$ { return 404; }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API proxy
        location /api/ {
            proxy_pass http://vesta-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }

        # APM RUM is site-owned. The portable image carries no installation
        # endpoint; sites that enable RUM supply their own nginx configuration.
        location /apm/ {
            return 404;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://vesta-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
