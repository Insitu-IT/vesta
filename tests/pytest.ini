[pytest]
# Pytest configuration for Vesta Backup

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers for categorizing tests
markers =
    integration: Integration tests requiring database
    security: Security and isolation tests
    unit: Unit tests
    slow: Slow-running tests
    requires_license: Tests that require specific license tier
    no_multitenancy: Needs Postgres but NOT the commercial multi-tenant models.
        tests/integration/conftest.py skips this whole directory when org_id
        columns are absent, which is the OSS/CI case — so a Postgres test that
        does not need multi-tenancy is swallowed by a skip meant for the RLS
        suites, and the job reports green having run nothing.

# Test paths
testpaths = tests

# Coverage options (if using pytest-cov)
# addopts = --cov=backend --cov-report=html --cov-report=term

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (prevent hanging)
# timeout = 300
